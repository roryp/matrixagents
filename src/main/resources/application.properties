# CORS configuration
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=*
quarkus.http.cors.access-control-allow-credentials=true

# Azure OpenAI Configuration
azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT}
azure.openai.api-key=${AZURE_OPENAI_API_KEY}
azure.openai.deployment=${AZURE_OPENAI_DEPLOYMENT:gpt-5}
azure.openai.embedding-deployment=${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:text-embedding-3-small}

# Logging
quarkus.log.level=INFO
quarkus.log.category."dev.langchain4j".level=DEBUG
quarkus.log.category."com.matrixagents".level=DEBUG
